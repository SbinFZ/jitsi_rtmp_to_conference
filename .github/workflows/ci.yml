name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            go.sum
            third_party/jitsi/go.sum
      - name: Install FFmpeg (Linux; enables media + RTMP integration tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal third_party/jitsi)" || { gofmt -l cmd internal third_party/jitsi; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Unit tests (race detector)
        if: runner.os != 'Windows'
        run: go test -race ./... && cd third_party/jitsi && go test -race ./...
      - name: Unit tests
        if: runner.os == 'Windows'
        shell: bash
        run: go test ./... && cd third_party/jitsi && go test ./...

  package:
    name: package (all OS / arch)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum
      - name: Cross-compile and package
        run: scripts/package.sh
      - name: Smoke test the native Linux package
        run: |
          tar -xzf dist/*_linux_amd64.tar.gz -C /tmp
          /tmp/jitsi-stream_*_linux_amd64/jitsi-stream --version
          /tmp/jitsi-stream_*_linux_amd64/jitsi-receive --version
      - uses: actions/upload-artifact@v7
        with:
          name: jitsi-stream-packages
          path: dist/*
          retention-days: 14

  docker:
    name: docker (multi-arch build check)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 + linux/arm64 (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
