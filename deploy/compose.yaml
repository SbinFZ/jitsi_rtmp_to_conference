# Docker Compose deployment (Linux; host networking keeps WebRTC/UDP simple).
#
#   cp env.example .env        # edit JITSI_ROOM, STREAM_INPUT, ...
#   docker compose up -d       # starts the mode selected by COMPOSE_PROFILES:
#                              #   pull   -> service "stream" (default)
#                              #   ingest -> service "ingest" (RTMP push)
#
# The input URL is passed via the STREAM_INPUT environment variable, so signed
# URLs and stream keys do not appear in the container's command line.
x-common: &common
  image: ${JITSI_STREAM_IMAGE:-ghcr.io/sbinfz/jitsi_rtmp_to_conference:latest}
  network_mode: host
  init: true
  # A missing meeting exits after --meeting-retries; Docker then restarts
  # with its own increasing delay, so the stream starts once the meeting does.
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  # Pull an external stream (HTTP-FLV / RTMP / RTSP / HLS ...) into the meeting.
  stream:
    <<: *common
    profiles: [pull]
    environment:
      STREAM_INPUT: ${STREAM_INPUT:-}
      NODEMEDIA_AUTH_KEY: ${NODEMEDIA_AUTH_KEY:-}
    command:
      - --host=${JITSI_HOST:-m.yuanjinapp.com}
      - --room=${JITSI_ROOM:?set JITSI_ROOM in .env}
      - --name=${STREAM_NAME:-Live Stream}
      - --input-proxy=${INPUT_PROXY:-}
      - --meeting-retries=${MEETING_RETRIES:-5}

  # Accept an RTMP push (OBS, encoders, mobile apps) and publish it.
  # OBS: server rtmp://<host>:${RTMP_PORT}/live   stream key ${RTMP_KEY}
  ingest:
    <<: *common
    profiles: [ingest]
    environment:
      STREAM_INPUT: rtmp://0.0.0.0:${RTMP_PORT:-1935}/live/${RTMP_KEY:-}
    command:
      - --listen
      - --host=${JITSI_HOST:-m.yuanjinapp.com}
      - --room=${JITSI_ROOM:?set JITSI_ROOM in .env}
      - --name=${INGEST_NAME:-RTMP Live}
      - --meeting-retries=${MEETING_RETRIES:-5}
