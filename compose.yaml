services:
  stream:
    build: .
    image: jitsi-stream:local
    # Linux only: simplifies ICE/UDP networking. No inbound HTTP service exposed.
    network_mode: host
    init: true
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      NODEMEDIA_AUTH_KEY: ${NODEMEDIA_AUTH_KEY:-}
    command:
      - --host
      - ${JITSI_HOST:-m.yuanjinapp.com}
      - --room
      - ${JITSI_ROOM:?Set JITSI_ROOM}
      - --input
      - ${STREAM_INPUT:?Set STREAM_INPUT}
      - --name
      - ${STREAM_NAME:-Live Stream}
      - --input-proxy
      - ${INPUT_PROXY:-}
